# ====================================================================
# Flowly Finance - NGINX Reverse Proxy Configuration (AWS EC2)
# Place this file in /etc/nginx/sites-available/flowly and symlink to
# /etc/nginx/sites-enabled/flowly
# ====================================================================

server {
    listen 80;
    server_name your-api-domain.com; # Replace with your custom domain or AWS EC2 Public DNS

    # Allow large uploads for KYC document images, PDFs, and Video KYC recordings
    client_max_body_size 50M;

    # Gzip Compression for fast responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket support (Required for Video KYC Socket.IO signaling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebRTC socket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
